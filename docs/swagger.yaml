      total_pages:
        type: integer
    type: object
info:
  contact:
    name: Outpost Support
  description: High-performance, fault-tolerant webhook delivery platform with exponential
    retries, rate limiting, HMAC signing, and dead-letter queues.
  license:
    name: MIT
  title: Outpost Webhook Delivery Engine API
  version: "1.0"
paths:
  /api/v1/applications:
    post:
      consumes:
      - application/json
      description: Register a new tenant application and generate an API key (op_live_...)
      parameters:
      - description: Application payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.CreateApplicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.ApplicationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      summary: Create application
      tags:
      - Applications
  /api/v1/applications/{id}:
    get:
      description: Fetch application details by UUID
      parameters:
      - description: Application UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.ApplicationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      summary: Get application by ID
      tags:
      - Applications
  /api/v1/deliveries:
    get:
      description: Query delivery logs with optional filtering by status, endpoint
        ID, date range, and pagination
      parameters:
      - description: Filter by status (pending, delivered, failed, dead_letter)
        in: query
        name: status
        type: string
      - description: Filter by endpoint UUID
        format: uuid
        in: query
        name: endpoint_id
        type: string
      - description: Filter from timestamp (RFC3339, e.g. 2026-09-01T00:00:00Z)
        in: query
        name: from
        type: string
      - description: Filter to timestamp (RFC3339, e.g. 2026-09-15T23:59:59Z)
        in: query
        name: to
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 20, max: 100)'
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.PaginatedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List deliveries
      tags:
      - Deliveries
  /api/v1/deliveries/{id}:
    get:
      description: Fetch full forensic details of a delivery attempt including destination
        HTTP response body
      parameters:
      - description: Delivery Attempt UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.DeliveryAttemptDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get delivery attempt
      tags:
      - Deliveries
  /api/v1/deliveries/{id}/retry:
    post:
      description: Reset attempt counter and re-queue a failed or dead-lettered delivery
        attempt for immediate dispatch
      parameters:
      - description: Delivery Attempt UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.DeliveryAttemptResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Manually retry delivery
      tags:
      - Deliveries
  /api/v1/endpoints:
    get:
      description: List all registered webhook endpoints for the authenticated application
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.EndpointResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List endpoints
      tags:
      - Endpoints
    post:
      consumes:
      - application/json
      description: Register a new webhook destination URL and generate an HMAC signing
        secret (whsec_...)
      parameters:
      - description: Endpoint configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.CreateEndpointRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.EndpointResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create endpoint
      tags:
      - Endpoints
  /api/v1/endpoints/{id}:
    delete:
      description: Delete a webhook endpoint and remove its subscriptions
      parameters:
      - description: Endpoint UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete endpoint
      tags:
      - Endpoints
    get:
      description: Fetch details of a specific webhook endpoint
      parameters:
      - description: Endpoint UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.EndpointResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get endpoint by ID
      tags:
      - Endpoints
    put:
      consumes:
      - application/json
      description: Update URL, description, status (active/inactive), or rate limit
        of an endpoint
      parameters:
      - description: Endpoint UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Endpoint update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.UpdateEndpointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.EndpointResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update endpoint
      tags:
      - Endpoints
  /api/v1/endpoints/{id}/subscriptions:
    get:
      description: List all active event type subscriptions for a specific endpoint
      parameters:
      - description: Endpoint UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.SubscriptionResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List endpoint subscriptions
      tags:
      - Subscriptions
    post:
      consumes:
      - application/json
      description: Subscribe an endpoint to receive events of a specific event type
      parameters:
      - description: Endpoint UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Subscription payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_LanreAkintayo_outpost_internal_dto.CreateSubscriptionRequest'
      produces:
