<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&amp;family=Montserrat:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

      .t-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; letter-spacing: -0.5px; }
      .t-sub   { font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 600; }
      .t-body  { font-family: 'Montserrat', -apple-system, sans-serif; font-weight: 500; }
      .t-mono  { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-weight: 500; }
    </style>

    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38BDF8"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Clean, Deep Background -->
  <rect width="1440" height="820" fill="#0A0D14"/>

  <!-- Minimal Blueprint Grid -->
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1A202C"/>
  </pattern>
  <rect width="1440" height="820" fill="url(#grid)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 45)">
    <text class="t-title" x="0" y="32" font-size="28" fill="#F8FAFC">HOOKOPS</text>
    <rect x="150" y="10" width="230" height="26" rx="4" fill="#131926" stroke="#222B3D" stroke-width="1"/>
    <text class="t-mono" x="265" y="27" font-size="11" fill="#38BDF8" font-weight="600" text-anchor="middle">CORE ENGINE ARCHITECTURE</text>
    
    <text class="t-body" x="0" y="66" font-size="13.5" fill="#E2E8F0">Internal Go concurrency pipeline &amp; PostgreSQL transactional queue design</text>

    <!-- Tech Pills -->
    <g transform="translate(980, 10)">
      <rect x="0" y="0" width="90" height="26" rx="4" fill="#131926" stroke="#222B3D" stroke-width="1"/>
      <text class="t-mono" x="45" y="17" font-size="11" fill="#E2E8F0" text-anchor="middle">Go 1.26+</text>

      <rect x="100" y="0" width="130" height="26" rx="4" fill="#131926" stroke="#222B3D" stroke-width="1"/>
      <text class="t-mono" x="165" y="17" font-size="11" fill="#E2E8F0" text-anchor="middle">PostgreSQL 16</text>

      <rect x="240" y="0" width="100" height="26" rx="4" fill="#131926" stroke="#222B3D" stroke-width="1"/>
      <text class="t-mono" x="290" y="17" font-size="11" fill="#38BDF8" text-anchor="middle">SKIP LOCKED</text>
    </g>
  </g>

  <!-- ==================== 4 MAIN PIPELINE STAGES ==================== -->

  <!-- STAGE 1: INGESTION & STORAGE -->
  <g transform="translate(60, 135)">
    <rect width="275" height="420" rx="8" fill="#111622" stroke="#1F283B" stroke-width="1.2"/>
    
    <text class="t-mono" x="22" y="36" font-size="11" fill="#38BDF8" font-weight="700" letter-spacing="1">STAGE 01</text>
    <text class="t-title" x="22" y="66" font-size="18" fill="#F8FAFC">Queue &amp; Storage</text>
    <text class="t-body" x="22" y="86" font-size="12" fill="#94A3B8">Atomic ACID persistence</text>

    <line x1="22" y1="106" x2="253" y2="106" stroke="#1A2233" stroke-width="1"/>

    <!-- Ingestion Detail -->
    <text class="t-sub" x="22" y="136" font-size="13" fill="#F8FAFC">API Ingestion</text>
    <text class="t-mono" x="22" y="158" font-size="11" fill="#E2E8F0">• POST /api/v1/events</text>
    <text class="t-mono" x="22" y="178" font-size="11" fill="#E2E8F0">• Idempotency dedupe</text>
    <text class="t-mono" x="22" y="198" font-size="11" fill="#E2E8F0">• Subscription fan-out</text>

    <!-- PostgreSQL Section -->
    <text class="t-sub" x="22" y="240" font-size="13" fill="#F8FAFC">PostgreSQL (The Queue)</text>
    <text class="t-mono" x="22" y="262" font-size="11" fill="#E2E8F0">• events table (audit)</text>
    <text class="t-mono" x="22" y="282" font-size="11" fill="#E2E8F0">• delivery_attempts table</text>
    <text class="t-mono" x="22" y="302" font-size="11" fill="#E2E8F0">• Status: pending | proc</text>

    <!-- Highlight Box -->
    <rect x="20" y="330" width="235" height="60" rx="5" fill="#0A0D14" stroke="#1A2233" stroke-width="1"/>
    <text class="t-sub" x="30" y="354" font-size="11" fill="#38BDF8">Single ACID Transaction</text>
    <text class="t-body" x="30" y="372" font-size="10.5" fill="#CBD5E1">Zero dual-write bugs</text>
  </g>

  <!-- LABELED ARROW 1: Stage 1 -> Stage 2 -->
  <g transform="translate(335, 345)">
    <line x1="8" y1="0" x2="62" y2="0" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text class="t-mono" x="35" y="-12" font-size="10" fill="#38BDF8" font-weight="700" text-anchor="middle">Task Batch</text>
    <text class="t-mono" x="35" y="16" font-size="9" fill="#94A3B8" text-anchor="middle">SKIP LOCKED</text>
  </g>

  <!-- STAGE 2: DISPATCHER -->
  <g transform="translate(405, 135)">
    <rect width="270" height="420" rx="8" fill="#111622" stroke="#1F283B" stroke-width="1.2"/>
    
    <text class="t-mono" x="22" y="36" font-size="11" fill="#38BDF8" font-weight="700" letter-spacing="1">STAGE 02</text>
    <text class="t-title" x="22" y="66" font-size="18" fill="#F8FAFC">Polling Dispatcher</text>
    <text class="t-body" x="22" y="86" font-size="12" fill="#94A3B8">Database polling loop</text>

    <line x1="22" y1="106" x2="248" y2="106" stroke="#1A2233" stroke-width="1"/>

    <!-- Key Dispatcher Functions -->
    <text class="t-sub" x="22" y="136" font-size="13" fill="#F8FAFC">Batch Claim via CTE</text>
    <text class="t-mono" x="22" y="158" font-size="11" fill="#38BDF8">FOR UPDATE SKIP LOCKED</text>
    <text class="t-body" x="22" y="178" font-size="11" fill="#CBD5E1">Lock-free between workers</text>

    <text class="t-sub" x="22" y="222" font-size="13" fill="#F8FAFC">Adaptive Polling</text>
    <text class="t-mono" x="22" y="244" font-size="11" fill="#E2E8F0">• Ticks every 2s</text>
    <text class="t-mono" x="22" y="264" font-size="11" fill="#E2E8F0">• Drains instantly on full batch</text>

    <text class="t-sub" x="22" y="308" font-size="13" fill="#F8FAFC">Crash Recovery</text>
    <text class="t-mono" x="22" y="330" font-size="11" fill="#E2E8F0">• Zombie task recovery (&gt;5m)</text>
    <text class="t-mono" x="22" y="350" font-size="11" fill="#E2E8F0">• Hand-off to bounded channel</text>

    <rect x="20" y="368" width="230" height="26" rx="4" fill="#0A0D14" stroke="#1A2233" stroke-width="1"/>
    <text class="t-mono" x="135" y="385" font-size="10" fill="#38BDF8" text-anchor="middle">chan DeliveryTask</text>
  </g>

  <!-- LABELED ARROW 2: Stage 2 -> Stage 3 -->
  <g transform="translate(675, 345)">
    <line x1="8" y1="0" x2="62" y2="0" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text class="t-mono" x="35" y="-12" font-size="9.5" fill="#38BDF8" font-weight="700" text-anchor="middle">chan Task</text>
    <text class="t-mono" x="35" y="16" font-size="8.5" fill="#94A3B8" text-anchor="middle">DeliveryTask</text>
  </g>

  <!-- STAGE 3: WORKER POOL (HERO) -->
  <g transform="translate(745, 135)">
    <rect width="310" height="420" rx="8" fill="#111622" stroke="#0284C7" stroke-width="1.6"/>
    
    <text class="t-mono" x="24" y="36" font-size="11" fill="#38BDF8" font-weight="700" letter-spacing="1">STAGE 03 • CONCURRENCY</text>
    <text class="t-title" x="24" y="66" font-size="18" fill="#F8FAFC">Worker Pool</text>
    <text class="t-body" x="24" y="86" font-size="12" fill="#94A3B8">Fixed Go goroutines pipeline</text>

    <line x1="24" y1="106" x2="286" y2="106" stroke="#1A2233" stroke-width="1"/>

    <!-- Worker Step 1 -->
    <text class="t-sub" x="24" y="136" font-size="13" fill="#F8FAFC">1. Token Bucket Rate Limiter</text>
    <text class="t-mono" x="24" y="156" font-size="11" fill="#E2E8F0">• sync.Map per endpoint</text>
    <text class="t-body" x="24" y="174" font-size="11" fill="#CBD5E1">• Lock-free atomic reads</text>

    <!-- Worker Step 2 -->
    <text class="t-sub" x="24" y="212" font-size="13" fill="#F8FAFC">2. HMAC-SHA256 Signer</text>
    <text class="t-mono" x="24" y="232" font-size="11" fill="#E2E8F0">• X-HookOps-Signature</text>
    <text class="t-mono" x="24" y="250" font-size="11" fill="#CBD5E1">• Timestamp + Event-ID</text>

    <!-- Worker Step 3 -->
    <text class="t-sub" x="24" y="288" font-size="13" fill="#F8FAFC">3. HTTP POST Deliverer</text>
    <text class="t-mono" x="24" y="308" font-size="11" fill="#E2E8F0">• 30s deadline</text>
    <text class="t-body" x="24" y="326" font-size="11" fill="#CBD5E1">• 4KB response capture</text>

    <!-- Safety Badge -->
    <rect x="22" y="356" width="266" height="34" rx="4" fill="#0A0D14" stroke="#1A2233" stroke-width="1"/>
    <text class="t-mono" x="155" y="378" font-size="11" fill="#34D399" text-anchor="middle">✓ recover() boundary per worker</text>
  </g>

  <!-- LABELED ARROW 3: Stage 3 -> Stage 4 -->
  <g transform="translate(1055, 345)">
    <line x1="8" y1="0" x2="62" y2="0" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text class="t-mono" x="35" y="-12" font-size="9" fill="#38BDF8" font-weight="700" text-anchor="middle">Signed POST</text>
    <text class="t-mono" x="35" y="16" font-size="8.5" fill="#94A3B8" text-anchor="middle">HMAC-SHA256</text>
  </g>

  <!-- STAGE 4: RESILIENCY & OUTCOMES -->
  <g transform="translate(1125, 135)">
    <rect width="265" height="420" rx="8" fill="#111622" stroke="#1F283B" stroke-width="1.2"/>
    
    <text class="t-mono" x="22" y="36" font-size="11" fill="#38BDF8" font-weight="700" letter-spacing="1">STAGE 04</text>
    <text class="t-title" x="22" y="66" font-size="18" fill="#F8FAFC">Resiliency Engine</text>
    <text class="t-body" x="22" y="86" font-size="12" fill="#94A3B8">Fault isolation &amp; recovery</text>

    <line x1="22" y1="106" x2="243" y2="106" stroke="#1A2233" stroke-width="1"/>

    <!-- Outcome 1 -->
    <circle cx="26" cy="132" r="3.5" fill="#10B981"/>
    <text class="t-sub" x="38" y="136" font-size="13" fill="#F8FAFC">200 OK (Success)</text>
    <text class="t-body" x="38" y="154" font-size="11" fill="#CBD5E1">Delivered • Reset failures</text>

    <!-- Outcome 2 -->
    <circle cx="26" cy="192" r="3.5" fill="#F59E0B"/>
    <text class="t-sub" x="38" y="196" font-size="13" fill="#F8FAFC">5xx / 429 (Retry)</text>
    <text class="t-mono" x="38" y="214" font-size="11" fill="#E2E8F0">Stepped backoff (30s → 4h)</text>
    <text class="t-body" x="38" y="230" font-size="10.5" fill="#CBD5E1">±20% Jitter stops storms</text>

    <!-- Outcome 3 -->
    <circle cx="26" cy="268" r="3.5" fill="#94A3B8"/>
    <text class="t-sub" x="38" y="272" font-size="13" fill="#F8FAFC">4xx Client Error</text>
    <text class="t-mono" x="38" y="290" font-size="11" fill="#E2E8F0">Direct to DLQ immediately</text>
    <text class="t-body" x="38" y="306" font-size="10.5" fill="#CBD5E1">Saves DB IOPS &amp; network</text>

    <!-- Outcome 4 -->
    <circle cx="26" cy="344" r="3.5" fill="#EF4444"/>
    <text class="t-sub" x="38" y="348" font-size="13" fill="#F8FAFC">Circuit Breaker</text>
    <text class="t-mono" x="38" y="366" font-size="11" fill="#E2E8F0">Trips after 20 failures</text>
    <text class="t-body" x="38" y="382" font-size="10.5" fill="#CBD5E1">Auto-disables endpoint</text>
  </g>

  <!-- ==================== BOTTOM: 4-PHASE GRACEFUL SHUTDOWN ==================== -->
  <g transform="translate(60, 580)">
    <text class="t-mono" x="0" y="18" font-size="11" fill="#38BDF8" font-weight="700" letter-spacing="1">05 / 4-PHASE DEPENDENCY-ORDERED GRACEFUL SHUTDOWN</text>

    <g transform="translate(0, 32)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect width="295" height="92" rx="6" fill="#111622" stroke="#1F283B" stroke-width="1"/>
        <text class="t-sub" x="18" y="26" font-size="12" fill="#38BDF8">1. Stop API Ingress</text>
        <text class="t-body" x="18" y="50" font-size="12" fill="#F8FAFC">Gin stops accepting new events</text>
        <text class="t-mono" x="18" y="72" font-size="11" fill="#94A3B8">5s deadline for in-flight calls</text>
      </g>

      <!-- Arrow 1->2 -->
      <line x1="305" y1="46" x2="330" y2="46" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Step 2 -->
      <g transform="translate(340, 0)">
        <rect width="295" height="92" rx="6" fill="#111622" stroke="#1F283B" stroke-width="1"/>
        <text class="t-sub" x="18" y="26" font-size="12" fill="#38BDF8">2. Stop Dispatcher</text>
        <text class="t-body" x="18" y="50" font-size="12" fill="#F8FAFC">Background poller terminates</text>
        <text class="t-mono" x="18" y="72" font-size="11" fill="#94A3B8">No more tasks claimed from DB</text>
      </g>

      <!-- Arrow 2->3 -->
      <line x1="645" y1="46" x2="670" y2="46" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Step 3 -->
      <g transform="translate(680, 0)">
        <rect width="295" height="92" rx="6" fill="#111622" stroke="#1F283B" stroke-width="1"/>
        <text class="t-sub" x="18" y="26" font-size="12" fill="#38BDF8">3. Drain Workers</text>
        <text class="t-body" x="18" y="50" font-size="12" fill="#F8FAFC">Task channel closed; drain pool</text>
        <text class="t-mono" x="18" y="72" font-size="11" fill="#34D399">15s deadline for HTTP deliveries</text>
      </g>

      <!-- Arrow 3->4 -->
      <line x1="985" y1="46" x2="1010" y2="46" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Step 4 -->
      <g transform="translate(1020, 0)">
        <rect width="300" height="92" rx="6" fill="#111622" stroke="#1F283B" stroke-width="1"/>
        <text class="t-sub" x="18" y="26" font-size="12" fill="#38BDF8">4. Close DB Pool</text>
        <text class="t-body" x="18" y="50" font-size="12" fill="#F8FAFC">Closed ONLY after workers finish</text>
        <text class="t-mono" x="18" y="72" font-size="11" fill="#94A3B8">Zero dropped tasks on deploy</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(60, 775)">
    <text class="t-mono" x="0" y="0" font-size="11" fill="#94A3B8">github.com/LanreAkintayo/hookops</text>
    <text class="t-mono" x="1320" y="0" font-size="11" fill="#94A3B8" text-anchor="end">Engineered with Go &amp; PostgreSQL • MIT Licensed</text>
  </g>
</svg>
