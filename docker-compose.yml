services:
  postgres:
    image: postgres:16-alpine
    container_name: hookops-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hookops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hookops"]
      interval: 5s
      timeout: 5s
      retries: 5

  hookops:
    image: hookops:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hookops-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hookops?sslmode=disable
      PORT: "8080"
      GIN_MODE: release
      ENVIRONMENT: production
      WORKER_COUNT: "10"
      MAX_RETRIES: "5"
      RETRY_BASE_DELAY: 30s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

